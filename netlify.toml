[build]
  publish = "dist"
  command = "bun run build"

[build.environment]
  BUN_VERSION = "1.4.2"
  # Netlify's image default is Node 18; astro 7 needs >=22.12
  NODE_VERSION = "24"
  PUBLIC_CF_BEACON_TOKEN = "15058256076747a0a03c5dadb0bb0d27"

# Cache-control and security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
